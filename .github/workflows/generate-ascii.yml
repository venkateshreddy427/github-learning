name: Generate ASCII Artwork

on: 
    push

jobs: 
    ascii_jobs: 
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repo
          uses: actions/checkout@v4
          
        - name: Listing Repo Files
          run: ls -la

        - name: Executing Shell Script
          run: | 
            chmod +x ascii-shell-script.sh
            ./ascii-shell-script.sh
          
          