name: Workflow Filters and Activities 
on: 
    workflow_dispatch: 
    # schedule:
    #     - cron: "*/59 * * * *"  # Which runs on every 59 min  
    push:

        # branches-ignore:
        #    - feature/*    # feature/add-music, feature/updateImages
        #    - test/**       # test/ui/index, test/checkout/payment/
        branches: 
            - main: 
            - '!feature/*'   # ignore pushing to any branch name starting with feature using !        
    pull_request: 
        types: 
            - opened
            - closed
        paths-ignore:
            - README.md # workflow will only run when a pull request that includes a change on any file other than README.md 
        branches-ignore: 
            - main      # configures your workflow to only run on pull requests that target specific branches.         
jobs: 
    hello: 
        runs-on: ubuntu-latest
        steps: 
        - run: echo this workflow/job/step is executed for event type - ${{ github.event_ame }}                    